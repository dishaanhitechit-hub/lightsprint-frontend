<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprints — LightSprint</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
<script type="module">
import { requireAuth } from "../assets/js/auth.js";
import { renderLayout, setContent } from "../assets/js/layout.js";
import { api } from "../assets/js/api.js";

requireAuth();
renderLayout("sprints");

const params = new URLSearchParams(location.search);
const projectId = params.get("project");
if (!projectId) location.href = "dashboard.html";

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

setContent(`
  <div class="page-header">
    <div>
      <div class="breadcrumb"><a href="dashboard.html">Projects</a> › <span id="proj-name">…</span></div>
      <div class="page-title">🏃 Sprints</div>
      <div class="page-subtitle">Plan and track your sprint cycles</div>
    </div>
    <button class="btn btn-primary" id="new-sprint-btn">+ New Sprint</button>
  </div>
  <div class="page-body">
    <div id="sprints-list" style="display:flex;flex-direction:column;gap:16px">
      <p style="color:#94a3b8;text-align:center;padding:40px 0">Loading...</p>
    </div>
  </div>

  <div class="modal-overlay" id="sprint-modal">
    <div class="modal" style="max-width:460px">
      <div class="modal-header">
        <span class="modal-title">Create Sprint</span>
        <button class="modal-close" id="sprint-modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="error-box" id="sprint-error" style="display:none"></div>
        <form id="sprint-form">
          <div class="form-group"><label class="form-label">Sprint Name *</label>
            <input class="form-input" id="sprint-name" required placeholder="Sprint 1" /></div>
          <div class="form-group"><label class="form-label">Goal</label>
            <textarea class="form-textarea" id="sprint-goal" placeholder="What does this sprint aim to achieve?" style="min-height:60px"></textarea></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Start Date</label>
              <input class="form-input" type="date" id="sprint-start" /></div>
            <div class="form-group"><label class="form-label">End Date</label>
              <input class="form-input" type="date" id="sprint-end" /></div>
          </div>
          <div class="modal-footer" style="padding:0">
            <button type="button" class="btn btn-secondary" id="sprint-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Sprint</button>
          </div>
        </form>
      </div>
    </div>
  </div>
`);

async function init() {
  const projData = await api.get(`/projects/${projectId}`);
  document.getElementById("proj-name").textContent = projData.project?.name || "";
  await loadSprints();
}

async function loadSprints() {
  const data = await api.get(`/projects/${projectId}/sprints`);
  const sprints = data.sprints || [];
  const list = document.getElementById("sprints-list");

  if (!sprints.length) {
    list.innerHTML = `<div style="text-align:center;padding:60px 0;color:#94a3b8">
      <div style="font-size:48px;margin-bottom:12px">🏃</div>
      <p style="font-weight:600;font-size:15px">No sprints yet</p>
      <p style="font-size:13px;margin-top:4px">Create your first sprint to start planning</p>
    </div>`;
    return;
  }

  list.innerHTML = "";
  for (const s of sprints) {
    const statsData = await api.get(`/sprints/${s.id}/stats`);
    const stats = statsData.total !== undefined ? statsData : { total: 0, done: 0, remaining: 0 };
    const pct = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;

    const daysLeft = s.end_date ? Math.ceil((new Date(s.end_date) - new Date()) / 86400000) : null;
    const isOverdue = daysLeft !== null && daysLeft < 0 && s.status === "active";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div style="padding:20px;border-bottom:1px solid #f1f5f9">
        <div style="display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:12px">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span class="badge badge-${s.status}">${s.status}</span>
              ${isOverdue ? `<span class="badge badge-critical">⚠️ Overdue</span>` : ""}
              ${daysLeft !== null && daysLeft >= 0 && s.status === "active" ? `<span class="badge badge-medium">${daysLeft}d left</span>` : ""}
            </div>
            <h3 style="font-size:16px;font-weight:700;color:#0f172a">${esc(s.name)}</h3>
            ${s.goal ? `<p style="font-size:13px;color:#64748b;margin-top:4px">${esc(s.goal)}</p>` : ""}
            <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:#94a3b8">
              ${s.start_date ? `<span>📅 ${s.start_date}</span>` : ""}
              ${s.end_date ? `<span>🏁 ${s.end_date}</span>` : ""}
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <a href="board.html?project=${projectId}&sprint_filter=${s.id}" class="btn btn-sm btn-secondary">Board</a>
            ${s.status === "planning" ? `<button class="btn btn-sm btn-primary action-btn" data-id="${s.id}" data-action="start">▶ Start</button>` : ""}
            ${s.status === "active" ? `<button class="btn btn-sm btn-ghost action-btn" data-id="${s.id}" data-action="complete">✓ Complete</button>` : ""}
            <button class="btn btn-sm btn-danger action-btn" data-id="${s.id}" data-action="delete">Del</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px">
          <div style="text-align:center;background:#f8fafc;border-radius:8px;padding:10px">
            <div style="font-size:22px;font-weight:800;color:#0f172a">${stats.total}</div>
            <div style="font-size:11px;color:#64748b">Total Tasks</div>
          </div>
          <div style="text-align:center;background:#f0fdf4;border-radius:8px;padding:10px">
            <div style="font-size:22px;font-weight:800;color:#16a34a">${stats.done}</div>
            <div style="font-size:11px;color:#64748b">Done</div>
          </div>
          <div style="text-align:center;background:#fefce8;border-radius:8px;padding:10px">
            <div style="font-size:22px;font-weight:800;color:#ca8a04">${stats.remaining}</div>
            <div style="font-size:11px;color:#64748b">Remaining</div>
          </div>
          <div style="text-align:center;background:#eff6ff;border-radius:8px;padding:10px">
            <div style="font-size:22px;font-weight:800;color:#2563eb">${pct}%</div>
            <div style="font-size:11px;color:#64748b">Complete</div>
          </div>
        </div>
        <div style="background:#f1f5f9;border-radius:8px;overflow:hidden">
          <div style="height:10px;background:${pct>=100?"#22c55e":"#6366f1"};width:${pct}%;transition:width .4s;min-width:${pct>0?"4px":"0"}"></div>
        </div>
      </div>`;
    list.appendChild(card);
  }

  document.querySelectorAll(".action-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { id, action } = btn.dataset;
      if (action === "start") await api.post(`/sprints/${id}/start`);
      else if (action === "complete") await api.post(`/sprints/${id}/complete`);
      else if (action === "delete" && confirm("Delete this sprint? Tasks will stay in the project.")) await api.delete(`/sprints/${id}`);
      loadSprints();
    });
  });
}

document.getElementById("new-sprint-btn").onclick = () => document.getElementById("sprint-modal").classList.add("open");
document.getElementById("sprint-modal-close").onclick = () => document.getElementById("sprint-modal").classList.remove("open");
document.getElementById("sprint-cancel").onclick = () => document.getElementById("sprint-modal").classList.remove("open");

document.getElementById("sprint-form").addEventListener("submit", async e => {
  e.preventDefault();
  const errEl = document.getElementById("sprint-error");
  errEl.style.display = "none";
  const data = await api.post(`/projects/${projectId}/sprints`, {
    name: document.getElementById("sprint-name").value.trim(),
    goal: document.getElementById("sprint-goal").value.trim(),
    start_date: document.getElementById("sprint-start").value || null,
    end_date: document.getElementById("sprint-end").value || null,
  });
  if (data.error) { errEl.textContent = data.error; errEl.style.display = "block"; return; }
  document.getElementById("sprint-modal").classList.remove("open");
  document.getElementById("sprint-form").reset();
  loadSprints();
});

init();
</script>
</body>
</html>
