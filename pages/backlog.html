<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog — LightSprint</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
<script type="module">
import { requireAuth } from "../assets/js/auth.js";
import { renderLayout, setContent } from "../assets/js/layout.js";
import { api } from "../assets/js/api.js";

requireAuth();
renderLayout("backlog");

const params = new URLSearchParams(location.search);
const projectId = params.get("project");
if (!projectId) location.href = "dashboard.html";

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

setContent(`
  <div class="page-header">
    <div>
      <div class="breadcrumb"><a href="dashboard.html">Projects</a> › <span id="proj-name">…</span></div>
      <div class="page-title">📋 Backlog</div>
      <div class="page-subtitle">Overdue tasks and tasks moved from pool. Admin assigns to sprints.</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="form-select" id="sprint-sel" style="width:200px"><option value="">Select sprint to assign...</option></select>
      <button class="btn btn-primary" id="assign-btn">Assign Selected →</button>
    </div>
  </div>
  <div class="page-body">
    <div class="stats-row" id="stats-row"></div>
    <div class="card" style="overflow:hidden">
      <div style="padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="select-all" style="width:16px;height:16px;accent-color:#6366f1" />
        <label for="select-all" style="font-size:13px;font-weight:600;color:#475569;cursor:pointer">Select All</label>
      </div>
      <table class="ls-table" id="backlog-table">
        <thead>
          <tr>
            <th style="width:32px"></th>
            <th>Task</th><th>Priority</th><th>Assignee</th>
            <th>Est. Hours</th><th>Due Date</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="backlog-body"><tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Assign Member Modal -->
  <div class="modal-overlay" id="assign-modal">
    <div class="modal" style="max-width:380px">
      <div class="modal-header">
        <span class="modal-title">Assign Task</span>
        <button class="modal-close" id="assign-modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">Assign to Member</label>
          <select class="form-select" id="member-sel"><option value="">Unassigned</option></select></div>
        <input type="hidden" id="assign-task-id" />
        <div class="modal-footer" style="padding:0">
          <button type="button" class="btn btn-secondary" id="assign-cancel">Cancel</button>
          <button class="btn btn-primary" id="assign-confirm">Assign</button>
        </div>
      </div>
    </div>
  </div>
`);

let members = [], selectedTasks = new Set();

async function init() {
  const [projData, membersData, sprintsData] = await Promise.all([
    api.get(`/projects/${projectId}`),
    api.get(`/projects/${projectId}/members`),
    api.get(`/projects/${projectId}/sprints`),
  ]);
  document.getElementById("proj-name").textContent = projData.project?.name || "";
  members = membersData.members || [];

  const memberSel = document.getElementById("member-sel");
  members.forEach(m => { const o = document.createElement("option"); o.value = m.user_id; o.textContent = m.user.name; memberSel.appendChild(o); });

  const sprintSel = document.getElementById("sprint-sel");
  (sprintsData.sprints || []).filter(s => s.status !== "completed").forEach(s => {
    const o = document.createElement("option"); o.value = s.id; o.textContent = `${s.name} (${s.status})`; sprintSel.appendChild(o);
  });

  await loadBacklog();
}

async function loadBacklog() {
  await api.post(`/projects/${projectId}/tasks/sync-overdue`);
  const data = await api.get(`/projects/${projectId}/tasks?sprint_id=backlog`);
  const tasks = data.tasks || [];

  document.getElementById("stats-row").innerHTML = `
    <div class="stat-card accent-orange"><div class="stat-value">${tasks.length}</div><div class="stat-label">In Backlog</div></div>
    <div class="stat-card accent-red"><div class="stat-value">${tasks.filter(t=>t.due_date && new Date(t.due_date)<new Date()).length}</div><div class="stat-label">Overdue</div></div>
    <div class="stat-card accent-indigo"><div class="stat-value">${tasks.filter(t=>!t.assignee_id).length}</div><div class="stat-label">Unassigned</div></div>
    <div class="stat-card accent-green"><div class="stat-value">${tasks.reduce((s,t)=>s+(t.story_points||0),0)}</div><div class="stat-label">Total Story Points</div></div>`;

  const tbody = document.getElementById("backlog-body");
  if (!tasks.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">✅ Backlog is empty</td></tr>`;
    return;
  }

  selectedTasks.clear();
  tbody.innerHTML = tasks.map(t => {
    const overdue = t.due_date && new Date(t.due_date) < new Date();
    return `<tr>
      <td><input type="checkbox" class="task-cb" data-id="${t.id}" style="width:16px;height:16px;accent-color:#6366f1" /></td>
      <td>
        <div style="font-weight:600;color:#0f172a">${esc(t.title)}</div>
        ${t.user_story_id ? `<div style="font-size:11px;color:#6366f1;margin-top:2px">📖 Story linked</div>` : ""}
      </td>
      <td><span class="badge badge-${t.priority}">${t.priority}</span></td>
      <td>${t.assignee_name
        ? `<div style="display:flex;align-items:center;gap:6px"><div class="task-card-avatar">${t.assignee_name[0]}</div>${esc(t.assignee_name)}</div>`
        : `<span style="color:#94a3b8;font-size:12px">—</span>`}</td>
      <td>${t.estimated_hours ? `<span style="color:#4f46e5;font-weight:600">${t.estimated_hours}h</span>` : "—"}</td>
      <td><span style="color:${overdue?"#dc2626":"#334155"};font-weight:${overdue?"700":"400"}">${t.due_date||"—"}${overdue?" ⚠️":""}</span></td>
      <td><div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-secondary" onclick="openAssign('${t.id}')">Assign</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')">Del</button>
      </div></td>
    </tr>`;
  }).join("");

  document.querySelectorAll(".task-cb").forEach(cb => {
    cb.addEventListener("change", () => { cb.checked ? selectedTasks.add(cb.dataset.id) : selectedTasks.delete(cb.dataset.id); });
  });
  document.getElementById("select-all").onchange = (e) => {
    document.querySelectorAll(".task-cb").forEach(cb => {
      cb.checked = e.target.checked;
      e.target.checked ? selectedTasks.add(cb.dataset.id) : selectedTasks.delete(cb.dataset.id);
    });
  };
}

window.openAssign = (id) => {
  document.getElementById("assign-task-id").value = id;
  document.getElementById("assign-modal").classList.add("open");
};
window.deleteTask = async (id) => {
  if (!confirm("Delete this task?")) return;
  await api.delete(`/tasks/${id}`);
  loadBacklog();
};

document.getElementById("assign-modal-close").onclick = () => document.getElementById("assign-modal").classList.remove("open");
document.getElementById("assign-cancel").onclick = () => document.getElementById("assign-modal").classList.remove("open");

document.getElementById("assign-confirm").onclick = async () => {
  const taskId = document.getElementById("assign-task-id").value;
  const userId = document.getElementById("member-sel").value;
  await api.put(`/tasks/${taskId}`, { assignee_id: userId || null });
  document.getElementById("assign-modal").classList.remove("open");
  loadBacklog();
};

document.getElementById("assign-btn").onclick = async () => {
  const sprintId = document.getElementById("sprint-sel").value;
  if (!sprintId) return alert("Select a sprint first");
  if (!selectedTasks.size) return alert("Select at least one task");
  for (const id of selectedTasks) await api.patch(`/tasks/${id}/sprint`, { sprint_id: sprintId });
  selectedTasks.clear();
  loadBacklog();
};

init();
</script>
</body>
</html>
