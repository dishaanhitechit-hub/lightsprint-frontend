<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — LightSprint</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
<script type="module">
import { requireAuth } from "../assets/js/auth.js";
import { renderLayout, setContent } from "../assets/js/layout.js";
import { api } from "../assets/js/api.js";

requireAuth();
renderLayout("dashboard");

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

setContent(`
  <div class="page-header">
    <div>
      <div class="page-title">My Projects</div>
      <div class="page-subtitle">Select a project to manage sprints and tasks</div>
    </div>
    <button class="btn btn-primary" id="new-project-btn">+ New Project</button>
  </div>
  <div class="page-body">
    <div id="projects-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
      <p style="color:#94a3b8;grid-column:1/-1;text-align:center;padding:40px 0">Loading...</p>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Create New Project</span>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="error-box" id="modal-error" style="display:none"></div>
        <form id="project-form">
          <div class="form-group"><label class="form-label">Project Name *</label>
            <input class="form-input" id="proj-name" required placeholder="My Sprint Project" /></div>
          <div class="form-group"><label class="form-label">Description</label>
            <textarea class="form-textarea" id="proj-desc" placeholder="What is this project about?"></textarea></div>
          <div class="modal-footer" style="padding:0">
            <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>
`);

async function loadProjects() {
  const data = await api.get("/projects/");
  const grid = document.getElementById("projects-grid");
  grid.innerHTML = "";
  if (!data.projects?.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#94a3b8">
      <div style="font-size:48px;margin-bottom:12px">📋</div>
      <p style="font-weight:600;font-size:15px">No projects yet</p>
      <p style="font-size:13px;margin-top:4px">Click "New Project" to get started</p>
    </div>`;
    return;
  }
  data.projects.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.cssText = "padding:20px;cursor:pointer;transition:box-shadow .15s";
    card.onmouseenter = () => card.style.boxShadow = "0 4px 16px rgba(0,0,0,.1)";
    card.onmouseleave = () => card.style.boxShadow = "";
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px">
        <h3 style="font-size:15px;font-weight:700;color:#0f172a">${esc(p.name)}</h3>
        <span style="font-size:11px;color:#94a3b8">${new Date(p.created_at).toLocaleDateString()}</span>
      </div>
      <p style="font-size:13px;color:#64748b;margin-bottom:16px;min-height:36px">${esc(p.description||"No description")}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <a href="task-pool.html?project=${p.id}" class="btn btn-sm btn-primary">Task Pool</a>
        <a href="board.html?project=${p.id}" class="btn btn-sm btn-secondary">Board</a>
        <a href="sprints.html?project=${p.id}" class="btn btn-sm btn-secondary">Sprints</a>
        <a href="stories.html?project=${p.id}" class="btn btn-sm btn-secondary">Stories</a>
      </div>`;
    grid.appendChild(card);
  });
}

document.getElementById("new-project-btn").onclick = () => document.getElementById("modal").classList.add("open");
document.getElementById("modal-close").onclick = () => document.getElementById("modal").classList.remove("open");
document.getElementById("cancel-btn").onclick = () => document.getElementById("modal").classList.remove("open");
document.getElementById("modal").addEventListener("click", e => { if (e.target === document.getElementById("modal")) document.getElementById("modal").classList.remove("open"); });

document.getElementById("project-form").addEventListener("submit", async e => {
  e.preventDefault();
  const errEl = document.getElementById("modal-error");
  errEl.style.display = "none";
  const data = await api.post("/projects/", { name: document.getElementById("proj-name").value.trim(), description: document.getElementById("proj-desc").value.trim() });
  if (data.error) { errEl.textContent = data.error; errEl.style.display = "block"; return; }
  document.getElementById("modal").classList.remove("open");
  document.getElementById("project-form").reset();
  loadProjects();
});

loadProjects();
</script>
</body>
</html>
