<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — LightSprint</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-indigo-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-lg">LS</div>
      <h1 class="text-2xl font-bold text-slate-800">LightSprint</h1>
    </div>
    <h2 class="text-xl font-semibold text-slate-700 mb-1">Create your account</h2>
    <p class="text-sm text-slate-500 mb-6">Start managing tasks the lightweight way</p>

    <div id="error-msg" class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg"></div>

    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
        <input type="text" id="name" required placeholder="Jane Doe"
          class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
        <input type="email" id="email" required placeholder="you@example.com"
          class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
        <input type="password" id="password" required placeholder="At least 6 characters"
          class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-sm" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm">
        Create Account
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Already have an account?
      <a href="login.html" class="text-indigo-600 hover:underline font-medium">Sign in</a>
    </p>
  </div>

  <script type="module">
    import { registerUser, isLoggedIn } from "../assets/js/auth.js";
    if (isLoggedIn()) window.location.href = "dashboard.html";

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("error-msg");
      errEl.classList.add("hidden");
      try {
        await registerUser(name, email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
